name: Build and deploy one-ip

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-ip-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: 0
  TZ: Asia/Shanghai
  WRANGLER_SEND_METRICS: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SPA
        run: pnpm build
      - name: Test Worker and application
        run: pnpm test
      - name: Upload static assets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: one-ip-dist
          path: dist
          if-no-files-found: error
          retention-days: 3

  # Deploy target: Worker by default. Set the DEPLOY_PAGE repository variable
  # to 'true' to deploy to Pages instead (either Worker or Pages, not both).
  # ENABLE_CF_DEPLOY must be 'true' for any deploy.
  deploy-worker:
    name: Create or update one-ip Worker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_CF_DEPLOY == 'true' && vars.DEPLOY_PAGE != 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: one-ip-dist
          path: dist
      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository secrets."
            exit 1
          fi
          pnpm exec wrangler deploy --env=""

  deploy-pages:
    name: Deploy one-ip to Cloudflare Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_CF_DEPLOY == 'true' && vars.DEPLOY_PAGE == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: one-ip-dist
          path: dist
      - name: Add Pages SPA fallback
        # Same single line generated by scripts/build-pages.mjs; kept inline so the shared Worker artifact stays clean.
        run: printf '%s\n' '/* /index.html 200' > dist/_redirects
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository secrets."
            exit 1
          fi
          pnpm deploy:pages

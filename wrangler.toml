name = "one-ip"
main = "public/worker/index.js"
compatibility_date = "2026-09-09"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/worker", "/worker/*"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 0.1
invocation_logs = false

[observability.traces]
enabled = false

[vars]
APP_ENV = "prod"

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1001"
simple = { limit = 180, period = 60 }

[[ratelimits]]
name = "ACTION_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[env.dev]
name = "one-ip-dev"

[env.dev.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[env.dev.vars]
APP_ENV = "dev"

[[env.dev.ratelimits]]
name = "API_LIMITER"
namespace_id = "3001"
simple = { limit = 180, period = 60 }

[[env.dev.ratelimits]]
name = "ACTION_LIMITER"
namespace_id = "3002"
simple = { limit = 5, period = 60 }

[env.stage]
name = "one-ip-stage"

[env.stage.vars]
APP_ENV = "stage"

[[env.stage.ratelimits]]
name = "API_LIMITER"
namespace_id = "2001"
simple = { limit = 180, period = 60 }

[[env.stage.ratelimits]]
name = "ACTION_LIMITER"
namespace_id = "2002"
simple = { limit = 5, period = 60 }
